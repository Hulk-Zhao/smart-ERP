# smart-ERP Prometheus 抓取与规则评估（full 档专属）
#
# 每一行 scrape 都对应「写指标的进程自己 serve /metrics」的服务，逐个核对过：
#   api:8010          — 对账批次/耗时、write_stage（apps/api/service.py、policy/gateway.py）
#   scheduler:8011    — smart_erp_audit_chain_broken（core/runtime/scheduler.py::_amain）
#   compensation:8013 — 补偿队列、unresolved、db_clock_skew（compensation_worker.py:295-302）
#
# 标签克制（README §6.2）：不注入 instance 之外的高基数标签；external_labels 只带栈名。
# ERP_METRICS_PATH 若被改掉，这里必须同步改 metrics_path，否则目标会 404。

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: smart-erp

rule_files:
  - /etc/prometheus/rules/smart-erp.rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: erp-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8010"]

  - job_name: erp-scheduler
    metrics_path: /metrics
    static_configs:
      - targets: ["scheduler:8011"]

  - job_name: erp-compensation
    metrics_path: /metrics
    static_configs:
      - targets: ["compensation:8013"]
