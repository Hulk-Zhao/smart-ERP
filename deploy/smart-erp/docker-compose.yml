# =============================================================================
# 聚合型 AI ERP · 云端精简档（demo：4C4G 现机 5 容器 / full：8G 起 12 容器）
# -----------------------------------------------------------------------------
# 依据：docs/product/tech/01-技术架构.md §1A.3（compose 拓扑）/ §1A.4（网络与端口）
#       §1A.6（健康检查与限额）/ §1A.7（共用 PG15 隔离）
#
# 档位差异（与 §1A.3 差异表一致）：
#   demo：api / worker（agent+io 合一）/ scheduler / connector-gw / web，合计 1200MiB；
#         + u8-stub（64MiB，**模拟外部系统**，演示跨系统写入/回滚用；不是真 U8），
#           故 demo 档显式限额合计 1264MiB（1200 业务 + 64 桩）；
#   full：demo 全部 + doc（3G）/ worker-agent（2G）/ worker-io（1G）/ migrate（一次性）
#         / compensation（256m，补偿执行器）/ prometheus（320m，规则评估）
#         / alertmanager（96m，告警接收）。
#         full 档通过 `--profile full` 启动；migrate 不进常驻循环（restart: "no"）。
#   监控只在 full 档：demo 拿不到 Prometheus 也不该假装有告警（规则文件头已写明）。
#
# 档位口径（唯一权威，T802 定稿 2026-11-11）：只有 demo / full 两个档位，
#   `--profile` 只接受 demo、full 这两个取值；**不存在 ops 档**，也不计划新增第三档。
#   证据：本文件全部 services 的 profiles 取值集合恰为 {demo, full}；
#   锁死方式：tests/deploy/test_compose_deploy.py::test_profiles_are_exactly_demo_and_full。
#
# 设计约束（评审时逐条对照，不是疏漏）：
#   1. 数据库复用外部 PG15（hulkai-gz-api 的 aps-postgres），本文件不起 pg / redis /
#      minio —— 任何档位都没有这些容器，CI 与 tests/deploy 均有断言。
#   2. 队列状态在 PG 的 erp.job_queue 表，不用 Redis（§1A.7.3）。
#   3. 迁移不在任何常驻容器的 entrypoint 里执行（§1A.6）；发布时由 erp_migrator
#      单独跑 alembic，成功后才 up -d。
#   4. 镜像 tag 必须是完整 40 位 git sha，用 ${ERP_IMAGE_TAG:?...} 强制；不建镜像仓库。
#   5. 不使用 memswap_limit 放水：宁可单容器 OOM 重启，也不要 4G 整机 swap 假死。
#
# 用法：
#   cp deploy/smart-erp/.env.example deploy/smart-erp/.env   # 填 ERP_IMAGE_TAG 等
#   docker compose --project-directory deploy/smart-erp --profile demo up -d
# =============================================================================
name: smart-erp

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

# 三个 Python 进程（api / worker / scheduler）共用 app 镜像；gw 与 web 各自独立。
x-app-image: &app-image "smart-erp/app:${ERP_IMAGE_TAG:?ERP_IMAGE_TAG must be the full 40-char git sha}"

x-app-env: &app-env
  TZ: Asia/Shanghai
  LANG: C.UTF-8
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # 键名以 apps/platform/config.py 为准（S0 已落地）：ERP_APP_ENV，不是 ERP_ENV
  # 全档位统一默认 demo（T803）：此前 full 专属服务写 `:-full`，一旦 .env 漏填，
  # api 会认为 demo、doc 会认为 full，同一部署出现两个环境值。full 档请显式设 ERP_APP_ENV=full。
  ERP_APP_ENV: ${ERP_APP_ENV:-demo}
  ERP_LOG_LEVEL: ${ERP_LOG_LEVEL:-INFO}
  ERP_IMAGE_TAG: ${ERP_IMAGE_TAG:?ERP_IMAGE_TAG must be the full 40-char git sha}
  ERP_CONFIG_DIR: ${ERP_CONFIG_DIR:-/app/config}

services:
  # ---------------------------------------------------------------------------
  # api：唯一对外暴露的业务端口 8010（香港反代 → 广州，见 §1A.4）
  # 预算 384m / 0.8 核；/healthz 不查依赖（避免共用实例抖动引发重启风暴）
  # ---------------------------------------------------------------------------
  api:
    profiles: ["demo", "full"]
    image: *app-image
    container_name: erp_api
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - uvicorn
      - apps.main:app
      - --host=0.0.0.0
      - --port=8010
      - --workers=1
      - --limit-concurrency=64
      - --root-path=${ERP_API_ROOT_PATH:-/erp/api}
    environment:
      <<: *app-env
      ERP_DATABASE_URL: ${ERP_DATABASE_URL:?ERP_DATABASE_URL is required (postgresql+asyncpg://erp_app:...@<pg-host>:5432/smart_erp)}
      ERP_DB_POOL_SIZE: ${ERP_DB_POOL_SIZE:-4}
      # 单个 api 进程内有多个独立引擎（container / ticket_sql / approval_sql /
      # audit_integrity / price_book / recon_store），它们共用 erp_app 的 20 连接上限；
      # 实测并发 30 时各池一起扩容会打满上限并返回 500。
      # 因此**单 api 进程时 overflow 必须是 0**；多副本部署要按 erp_app 连接上限
      # 重新核算（副本数 × (pool+overflow) + worker/scheduler），不要直接放开这个值。
      ERP_DB_MAX_OVERFLOW: ${ERP_DB_MAX_OVERFLOW:-0}
      # 角色级已有默认；这里显式下发，避免实例 owner 漏设时没有兜底（C14）
      ERP_DB_STATEMENT_TIMEOUT_MS: ${ERP_DB_STATEMENT_TIMEOUT_MS:-30000}
      ERP_DB_LOCK_TIMEOUT_MS: ${ERP_DB_LOCK_TIMEOUT_MS:-3000}
      ERP_DB_IDLE_TX_TIMEOUT_MS: ${ERP_DB_IDLE_TX_TIMEOUT_MS:-60000}
      ERP_API_PORT: ${ERP_API_PORT:-8010}
      ERP_API_ROOT_PATH: ${ERP_API_ROOT_PATH:-/erp/api}
      ERP_CONNECTOR_GW_URL: ${ERP_CONNECTOR_GW_URL:-http://connector-gw:8012}
      # U8 基地址：缺省指向栈内 u8-stub（**模拟外部系统，不是真 U8**，见该服务注释）。
      # 桩没起来时写入会显式失败（连接错误 → 5xx E-CONN-UNAVAILABLE），不会静默成功。
      # full/生产必须显式覆盖为真实地址；本键是唯一的写出口连接点。
      ERP_U8_BASE_URL: ${ERP_U8_BASE_URL:-http://u8-stub:8021}
      ERP_OBJECT_STORE_DRIVER: ${ERP_OBJECT_STORE_DRIVER:-local}
      ERP_OBJECT_STORE_PATH: ${ERP_OBJECT_STORE_PATH:-/data/objects}
      ERP_S3_ENDPOINT: ${ERP_S3_ENDPOINT:-}
      ERP_S3_BUCKET: ${ERP_S3_BUCKET:-}
      ERP_S3_ACCESS_KEY: ${ERP_S3_ACCESS_KEY:-}
      ERP_S3_SECRET_KEY: ${ERP_S3_SECRET_KEY:-}
      ERP_LLM_BASE_URL: ${ERP_LLM_BASE_URL:-}
      ERP_LLM_API_KEY: ${ERP_LLM_API_KEY:-}
      ERP_LLM_MODEL: ${ERP_LLM_MODEL:-}
      ERP_LLM_TIMEOUT_SECONDS: ${ERP_LLM_TIMEOUT_SECONDS:-60}
      ERP_ASSISTANT_RATE_LIMIT_PER_MINUTE: ${ERP_ASSISTANT_RATE_LIMIT_PER_MINUTE:-10}
      # 同步回滚入口（apps/api/rollback_gate.py）：两个档位都显式下发，默认关闭。
      # 补偿会在外部系统留下冲销记录，未经演练/未确认事件留痕前不得默认打开。
      # 演示现场要点通时：在 .env 设 ERP_ROLLBACK_SYNC_ENABLED=true 后
      # `--force-recreate api`（restart 不重读 env）；关闭时仍返回 503 且零副作用。
      ERP_ROLLBACK_SYNC_ENABLED: "${ERP_ROLLBACK_SYNC_ENABLED:-false}"
      # full 档的 Prometheus 抓这里；默认开启（内网端点，nginx 对 /erp/api/metrics 直接 404）
      ERP_METRICS_ENABLED: "${ERP_METRICS_ENABLED:-true}"
      ERP_METRICS_PATH: "${ERP_METRICS_PATH:-/metrics}"
      # demo 静态会话：默认关闭；开启时 ERP_APP_ENV 必须为 demo，否则 api 拒绝启动。
      # 身份以 JSON 数组注入（每条一枚令牌 / 一个 user_id），可同时存在发起人与
      # 审批人，用于演示双人复核；API 不提供任何签发端点（apps/api/demo_session.py）。
      ERP_DEMO_SESSION_ENABLED: "${ERP_DEMO_SESSION_ENABLED:-}"
      ERP_DEMO_SESSION_IDENTITIES: "${ERP_DEMO_SESSION_IDENTITIES:-}"
    ports:
      # 只绑回环：公网入口只有 hk-web 的 nginx（/erp/api/ → 127.0.0.1:8010），
      # 宿主不再监听 0.0.0.0。4C4G 演示机若确需宿主直连，显式设 ERP_API_BIND=0.0.0.0。
      - "${ERP_API_BIND:-127.0.0.1}:${ERP_API_PORT:-8010}:8010"
    volumes:
      - erp_objects:/data/objects
      - erp_logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - smart-erp-net
      - erp-db-net
    depends_on:
      connector-gw:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.8
    healthcheck:
      # 纯 python 探测：slim 镜像不带 curl/wget，避免为探针多装一个包
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8010/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # worker：demo 档把 agent 队列与 io 队列合并在一个容器（full 档拆 worker-io）
  # 预算 512m / 1.5 核；健康检查写 worker_heartbeat 行（§1A.6），不依赖 broker
  # ---------------------------------------------------------------------------
  worker:
    profiles: ["demo"]
    image: *app-image
    container_name: erp_worker
    restart: unless-stopped
    stop_grace_period: 60s
    command:
      - python
      - -m
      - core.runtime.worker
      - --queues=${ERP_WORKER_QUEUES:-agent,io}
      - --concurrency=${ERP_WORKER_CONCURRENCY:-4}
    environment:
      <<: *app-env
      ERP_DATABASE_URL: ${ERP_DATABASE_URL:?ERP_DATABASE_URL is required (postgresql+asyncpg://erp_app:...@<pg-host>:5432/smart_erp)}
      ERP_DB_POOL_SIZE: ${ERP_DB_POOL_SIZE:-4}
      ERP_DB_MAX_OVERFLOW: ${ERP_DB_MAX_OVERFLOW:-0}
      # 心跳间隔必须 ≤ lease/2（默认租约 60s → 上限 30s），超了 worker 拒绝启动；
      # 租约续约周期是 lease/3=20s，启动日志会打 lease=60.0s renew=20.0s。
      ERP_HEARTBEAT_INTERVAL_SECONDS: ${ERP_HEARTBEAT_INTERVAL_SECONDS:-30}
      ERP_CONNECTOR_GW_URL: ${ERP_CONNECTOR_GW_URL:-http://connector-gw:8012}
      ERP_OBJECT_STORE_DRIVER: ${ERP_OBJECT_STORE_DRIVER:-local}
      ERP_OBJECT_STORE_PATH: ${ERP_OBJECT_STORE_PATH:-/data/objects}
      ERP_S3_ENDPOINT: ${ERP_S3_ENDPOINT:-}
      ERP_S3_BUCKET: ${ERP_S3_BUCKET:-}
      ERP_S3_ACCESS_KEY: ${ERP_S3_ACCESS_KEY:-}
      ERP_S3_SECRET_KEY: ${ERP_S3_SECRET_KEY:-}
      ERP_LLM_BASE_URL: ${ERP_LLM_BASE_URL:-}
      ERP_LLM_API_KEY: ${ERP_LLM_API_KEY:-}
      ERP_LLM_MODEL: ${ERP_LLM_MODEL:-}
      ERP_LLM_TIMEOUT_SECONDS: ${ERP_LLM_TIMEOUT_SECONDS:-60}
    volumes:
      - erp_objects:/data/objects
      - erp_logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - smart-erp-net
      - erp-db-net
    mem_limit: 512m
    cpus: 1.5
    healthcheck:
      # --check 一次性探活后退出；不带它 tools.health 会起 8011 并常驻，探针必然超时
      test: ["CMD", "python", "-m", "tools.health", "worker", "--check", "--queues", "agent,io"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # scheduler：单实例（pg_advisory_lock），只做巡检与定时，不执行迁移
  # 预算 96m / 0.2 核
  # ---------------------------------------------------------------------------
  scheduler:
    profiles: ["demo", "full"]
    image: *app-image
    container_name: erp_scheduler
    restart: unless-stopped
    stop_grace_period: 30s
    command: ["python", "-m", "core.runtime.scheduler"]
    environment:
      <<: *app-env
      ERP_DATABASE_URL: ${ERP_DATABASE_URL:?ERP_DATABASE_URL is required (postgresql+asyncpg://erp_app:...@<pg-host>:5432/smart_erp)}
      ERP_DB_POOL_SIZE: ${ERP_DB_POOL_SIZE:-1}
      ERP_DB_MAX_OVERFLOW: ${ERP_DB_MAX_OVERFLOW:-0}
      # 实际循环间隔 = min(tick, lease/2)；lease 默认 30 → 这里写 60 实际是每 15s 一跳。
      # 启动日志会打 `tick_seconds=60 source=env lease=30 effective=15`，别只看这个数。
      ERP_SCHEDULER_TICK_SECONDS: ${ERP_SCHEDULER_TICK_SECONDS:-60}
      ERP_HEARTBEAT_INTERVAL_SECONDS: ${ERP_HEARTBEAT_INTERVAL_SECONDS:-30}
      # 日切锚点：full 档默认开启；demo 档在 .env.demo 里置 0，
      # 演示环境不再每 tick 给有审计影像的租户补锚点行（避免与演示无关的写入和告警噪声）。
      ERP_AUDIT_ANCHOR: ${ERP_AUDIT_ANCHOR:-1}
      ERP_CONNECTOR_GW_URL: ${ERP_CONNECTOR_GW_URL:-http://connector-gw:8012}
      # 审计链 gauge 写在本进程内存，必须由本进程 serve /metrics（README §6.1.2 第 5 条）。
      # 端口只 expose 不发布；关闭开关等于让 P0 规则永远 absent，默认必须为 true。
      ERP_METRICS_ENABLED: ${ERP_METRICS_ENABLED:-true}
      ERP_METRICS_PORT: ${ERP_METRICS_PORT:-8011}
      ERP_METRICS_PATH: ${ERP_METRICS_PATH:-/metrics}
    volumes:
      - erp_logs:/app/logs
    networks:
      - smart-erp-net
      - erp-db-net
    expose:
      # 8011 只在内网可抓：Prometheus → scheduler:8011
      - "8011"
    mem_limit: 96m
    cpus: 0.2
    healthcheck:
      # 近 5 分钟无心跳即判死；锁丢失时返回非 0（§1A.6）。--check 一次性退出，不走 8011
      test: ["CMD", "python", "-m", "tools.health", "scheduler", "--check"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # compensation：补偿执行器（独立进程，消费 erp.compensation_task）
  # 只认队列有到期行（不按工单/步骤状态扫）；自 serve /metrics 与 /healthz（8013 内网）
  # full 档专属：demo 档不启动执行器；API 侧同步回滚入口默认关闭
  # （ERP_ROLLBACK_SYNC_ENABLED=false → 503 E-ROLLBACK-UNAVAILABLE），因此 demo 档没有可用回滚路径
  # 预算 256m / 0.5 核
  # ---------------------------------------------------------------------------
  compensation:
    profiles: ["full"]
    image: *app-image
    container_name: erp_compensation
    restart: unless-stopped
    stop_grace_period: 60s
    command: ["python", "-m", "apps.agents.compensation_worker"]
    environment:
      <<: *app-env
      ERP_DATABASE_URL: ${ERP_DATABASE_URL:?ERP_DATABASE_URL is required (postgresql+asyncpg://erp_app:...@<pg-host>:5432/smart_erp)}
      ERP_DB_POOL_SIZE: ${ERP_DB_POOL_SIZE:-2}
      ERP_DB_MAX_OVERFLOW: ${ERP_DB_MAX_OVERFLOW:-0}
      ERP_COMPENSATION_PORT: ${ERP_COMPENSATION_PORT:-8013}
      ERP_COMPENSATION_POLL_SECONDS: ${ERP_COMPENSATION_POLL_SECONDS:-1.0}
      ERP_COMPENSATION_STALE_SECONDS: ${ERP_COMPENSATION_STALE_SECONDS:-60}
    volumes:
      - erp_logs:/app/logs
    networks:
      - smart-erp-net
      - erp-db-net
    # 只在内网可抓 /metrics 与 /healthz，不发布宿主端口
    expose:
      - "8013"
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      # 只探本进程的 /healthz：最近一次 tick 超时即 503
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8013/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # connector-gw：**预留服务，不是写入通道**。
  # 当前只注册 /healthz、/readyz；运行期零调用方，没有 MCP server / 业务路由，
  # 写只能经 api 进程内 WriteGateway.execute()，不得在此添加业务或写端点。
  # 最小权限：不挂 erp-db-net（网关不需要 DB），read_only 根文件系统
  # 预算 160m / 0.3 核；8012 只在内网暴露
  # ---------------------------------------------------------------------------
  connector-gw:
    profiles: ["demo", "full"]
    image: "smart-erp/connector-gw:${ERP_IMAGE_TAG:?ERP_IMAGE_TAG must be the full 40-char git sha}"
    container_name: erp_gw
    restart: unless-stopped
    stop_grace_period: 30s
    # 入口以 S1 落地的 apps/connectors/gateway.py 为准：host 默认 0.0.0.0，
    # 端口读 ERP_CONNECTOR_GW_PORT（缺省 8012），因此这里不再硬编码 --port。
    # tests/deploy 有断言锁死这条命令，防止回退到旧路径 connectors.gateway。
    command: ["python", "-m", "apps.connectors.gateway"]
    read_only: true
    tmpfs:
      - /tmp:size=32m
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      ERP_APP_ENV: ${ERP_APP_ENV:-demo}
      ERP_LOG_LEVEL: ${ERP_LOG_LEVEL:-INFO}
      ERP_IMAGE_TAG: ${ERP_IMAGE_TAG:?ERP_IMAGE_TAG must be the full 40-char git sha}
      ERP_CONFIG_DIR: ${ERP_CONFIG_DIR:-/app/config}
      # 与下方 expose 的 8012 对齐；apps/connectors/gateway.py 读这个键
      ERP_CONNECTOR_GW_PORT: ${ERP_CONNECTOR_GW_PORT:-8012}
      ERP_GW_TIMEOUT_SECONDS: ${ERP_GW_TIMEOUT_SECONDS:-30}
      # U8 连接器基地址：由 compose 下发；缺省值必须与 contracts/config.schema.json 的 default 逐字一致
      ERP_U8_BASE_URL: ${ERP_U8_BASE_URL:-http://u8.invalid}
      # 出网白名单写在 config 快照里，随仓库版本管理；此处只给路径
      ERP_GW_EGRESS_ALLOWLIST_FILE: ${ERP_GW_EGRESS_ALLOWLIST_FILE:-/app/config/gw-egress.yaml}
      # 文件通道收件箱（apps/connectors/gateway.py 装配）：留空 = 不挂 file 连接器。
      # demo 档在 deploy/smart-erp/env/demo.env 里默认给 /data/inbox；
      # full/prod 保持留空（默认关闭），不要在这里写死默认目录，否则 prod 会被悄悄打开。
      ERP_FILE_INBOX: ${ERP_FILE_INBOX:-}
    volumes:
      - ./config:/app/config:ro
      # 供应商对账单/送货单等 CSV 的落盘目录：**只读**挂载，网关只能读不能写
      - ./inbox:/data/inbox:ro
    networks:
      - smart-erp-net
    expose:
      # 8012 只在内网可达：栈内 api/worker 调用，宿主不发布（§1A.4）
      - "8012"
    mem_limit: 160m
    cpus: 0.3
    healthcheck:
      # 返回已注册动作数与白名单 hash（§1A.6）
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8012/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # u8-stub：**模拟外部系统**，只用于演示「跨系统写入 + 可审计回滚」
  # **不是 U8、也不是任何真实 ERP**：启动横幅、响应体 simulated 字段、
  # X-Simulated-System 响应头都标注模拟；端口 8021 只 expose 内网，不发布宿主。
  # 只挂 demo：full/生产档的 ERP_U8_BASE_URL 指向真实系统，在那里起桩等于伪造写入。
  # 不设 api 对它的 depends_on —— 演示「桩没起来时写入显式失败」需要它们彼此独立。
  # 预算 64m / 0.1 核（纯标准库 http.server，无外部依赖）
  # ---------------------------------------------------------------------------
  u8-stub:
    profiles: ["demo"]
    image: *app-image
    container_name: erp_u8_stub
    restart: unless-stopped
    stop_grace_period: 10s
    # 与 apps/connectors/u8/stub_server.py 的 argparse 对齐（--host/--port）；
    # 不用默认 8013：8013 已被 full 档 compensation 占用。
    command:
      - python
      - -m
      - apps.connectors.u8.stub_server
      - --host=0.0.0.0
      - --port=8021
    # 桩不读写库、不连队列，因此**不继承 x-app-env**：它只需要无缓冲输出，
    # 少注入一个 ERP_ 键就少一处需要登记的配置面。
    environment:
      PYTHONUNBUFFERED: "1"
    networks:
      - smart-erp-net
    # 只绑宿主回环，供演示时直接 curl /stub/requests、/stub/receipts 取证
    # （容器网络内的 api 走 http://u8-stub:8021，不经过这里）。
    # 不要改成 0.0.0.0：桩没有任何鉴权，一旦上公网就是一个可写的外部系统。
    ports:
      - "127.0.0.1:8021:8021"
    mem_limit: 64m
    cpus: 0.1
    healthcheck:
      # 桩自己的探针路径（/stub/healthz 返回 simulated=true）；它不是本仓库的
      # 业务服务，因此不走 C13 的 /healthz 契约。
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8021/stub/healthz', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # web：自带 nginx 的静态产物，子路径部署 base=/demo/smart-erp/
  # 预算 48m / 0.1 核；8088:8080 仅香港反代访问
  # ---------------------------------------------------------------------------
  web:
    profiles: ["demo", "full"]
    image: "smart-erp/web:${ERP_IMAGE_TAG:?ERP_IMAGE_TAG must be the full 40-char git sha}"
    container_name: erp_web
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      TZ: Asia/Shanghai
    ports:
      - "${ERP_WEB_PORT:-8088}:8080"
    networks:
      - smart-erp-net
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 48m
    cpus: 0.1
    healthcheck:
      # nginx:alpine 自带 busybox wget；/healthz 由 web-nginx.conf 直接返回 200
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging

  # ===========================================================================
  # 以下 4 个服务只在 full 档启动（--profile full）；demo 档不占用内存
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # doc：文档解析（OCR/版面分析未来在此进程内做）
  # 预算 3072m / 1.5 核；解析器冷启动慢，start_period 给到 300s（§1A.3）
  # 现状：S5 尚未交付 erp_doc 常驻进程，入口是镜像内的临时健康壳，
  #       /readyz 会真跑一次解析管线（见 projects/smart-ERP/docker/docparse_service.py）
  # ---------------------------------------------------------------------------
  doc:
    profiles: ["full"]
    image: "smart-erp/doc:${ERP_IMAGE_TAG:?ERP_IMAGE_TAG must be the full 40-char git sha}"
    container_name: erp_doc
    restart: unless-stopped
    stop_grace_period: 120s
    command: ["python", "/app/docparse_service.py", "--port=8020"]
    environment:
      <<: *app-env
      ERP_APP_ENV: ${ERP_APP_ENV:-demo}
      # 与下方 expose 的 8020 对齐
      ERP_DOC_PORT: ${ERP_DOC_PORT:-8020}
      ERP_OBJECT_STORE_DRIVER: ${ERP_OBJECT_STORE_DRIVER:-local}
      ERP_OBJECT_STORE_PATH: ${ERP_OBJECT_STORE_PATH:-/data/objects}
      ERP_S3_ENDPOINT: ${ERP_S3_ENDPOINT:-}
      ERP_S3_BUCKET: ${ERP_S3_BUCKET:-}
      ERP_S3_ACCESS_KEY: ${ERP_S3_ACCESS_KEY:-}
      ERP_S3_SECRET_KEY: ${ERP_S3_SECRET_KEY:-}
    volumes:
      - erp_objects:/data/objects
      - ./config:/app/config:ro
    networks:
      - smart-erp-net
    expose:
      # 8020 只在内网：worker/doc 之间互访，宿主不发布（§1A.4）
      - "8020"
    mem_limit: 3072m
    cpus: 1.5
    healthcheck:
      # 探 /readyz：真跑一次解析管线，管线坏了容器就应判不健康（/healthz 只证明进程活着）
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8020/readyz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # worker-agent：full 档把 agent 队列单独拆出（demo 档由 worker 合并承担）
  # 预算 2048m / 2 核
  # ---------------------------------------------------------------------------
  worker-agent:
    profiles: ["full"]
    image: *app-image
    container_name: erp_worker_agent
    restart: unless-stopped
    stop_grace_period: 60s
    command:
      - python
      - -m
      - core.runtime.worker
      - --queues=agent
      - --concurrency=${ERP_AGENT_WORKER_CONCURRENCY:-4}
    environment:
      <<: *app-env
      ERP_APP_ENV: ${ERP_APP_ENV:-demo}
      ERP_DATABASE_URL: ${ERP_DATABASE_URL:?ERP_DATABASE_URL is required (postgresql+asyncpg://erp_app:...@<pg-host>:5432/smart_erp)}
      ERP_DB_POOL_SIZE: ${ERP_DB_POOL_SIZE:-4}
      ERP_DB_MAX_OVERFLOW: ${ERP_DB_MAX_OVERFLOW:-0}
      # 心跳间隔必须 ≤ lease/2（默认租约 60s → 上限 30s），超了 worker 拒绝启动；
      # 租约续约周期是 lease/3=20s，启动日志会打 lease=60.0s renew=20.0s。
      ERP_HEARTBEAT_INTERVAL_SECONDS: ${ERP_HEARTBEAT_INTERVAL_SECONDS:-30}
      ERP_CONNECTOR_GW_URL: ${ERP_CONNECTOR_GW_URL:-http://connector-gw:8012}
      ERP_OBJECT_STORE_DRIVER: ${ERP_OBJECT_STORE_DRIVER:-local}
      ERP_OBJECT_STORE_PATH: ${ERP_OBJECT_STORE_PATH:-/data/objects}
      ERP_S3_ENDPOINT: ${ERP_S3_ENDPOINT:-}
      ERP_S3_BUCKET: ${ERP_S3_BUCKET:-}
      ERP_S3_ACCESS_KEY: ${ERP_S3_ACCESS_KEY:-}
      ERP_S3_SECRET_KEY: ${ERP_S3_SECRET_KEY:-}
      ERP_LLM_BASE_URL: ${ERP_LLM_BASE_URL:-}
      ERP_LLM_API_KEY: ${ERP_LLM_API_KEY:-}
      ERP_LLM_MODEL: ${ERP_LLM_MODEL:-}
      ERP_LLM_TIMEOUT_SECONDS: ${ERP_LLM_TIMEOUT_SECONDS:-60}
    volumes:
      - erp_objects:/data/objects
      - erp_logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - smart-erp-net
      - erp-db-net
    mem_limit: 2048m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-m", "tools.health", "worker", "--check", "--queues", "agent"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # worker-io：full 档的 io 队列（文件导入/导出/对象存储搬运），与 agent 隔离，
  # 避免大 IO 任务把 agent 的响应时间拖长
  # 预算 1024m / 1 核
  # ---------------------------------------------------------------------------
  worker-io:
    profiles: ["full"]
    image: *app-image
    container_name: erp_worker_io
    restart: unless-stopped
    stop_grace_period: 120s
    command:
      - python
      - -m
      - core.runtime.worker
      - --queues=io
      - --concurrency=${ERP_IO_WORKER_CONCURRENCY:-2}
    environment:
      <<: *app-env
      ERP_APP_ENV: ${ERP_APP_ENV:-demo}
      ERP_DATABASE_URL: ${ERP_DATABASE_URL:?ERP_DATABASE_URL is required (postgresql+asyncpg://erp_app:...@<pg-host>:5432/smart_erp)}
      ERP_DB_POOL_SIZE: ${ERP_DB_POOL_SIZE:-2}
      ERP_DB_MAX_OVERFLOW: ${ERP_DB_MAX_OVERFLOW:-0}
      # 心跳间隔必须 ≤ lease/2（默认租约 60s → 上限 30s），超了 worker 拒绝启动；
      # 租约续约周期是 lease/3=20s，启动日志会打 lease=60.0s renew=20.0s。
      ERP_HEARTBEAT_INTERVAL_SECONDS: ${ERP_HEARTBEAT_INTERVAL_SECONDS:-30}
      ERP_CONNECTOR_GW_URL: ${ERP_CONNECTOR_GW_URL:-http://connector-gw:8012}
      ERP_OBJECT_STORE_DRIVER: ${ERP_OBJECT_STORE_DRIVER:-local}
      ERP_OBJECT_STORE_PATH: ${ERP_OBJECT_STORE_PATH:-/data/objects}
      ERP_S3_ENDPOINT: ${ERP_S3_ENDPOINT:-}
      ERP_S3_BUCKET: ${ERP_S3_BUCKET:-}
      ERP_S3_ACCESS_KEY: ${ERP_S3_ACCESS_KEY:-}
      ERP_S3_SECRET_KEY: ${ERP_S3_SECRET_KEY:-}
      ERP_DOC_SERVICE_URL: ${ERP_DOC_SERVICE_URL:-http://doc:8020}
    volumes:
      - erp_objects:/data/objects
      - erp_logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - smart-erp-net
      - erp-db-net
    mem_limit: 1024m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-m", "tools.health", "worker", "--check", "--queues", "io"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # migrate：一次性迁移（erp_migrator 角色，连接数限 4）
  # 不进常驻循环：restart: "no"，跑完即退出；发布流程里先 run --rm migrate 再 up -d
  # 预算 128m / 0.2 核
  # ---------------------------------------------------------------------------
  migrate:
    profiles: ["full"]
    image: *app-image
    container_name: erp_migrate
    restart: "no"
    command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    environment:
      <<: *app-env
      ERP_APP_ENV: ${ERP_APP_ENV:-demo}
      # 用迁移专用角色，不用业务的 erp_app：DDL 权限只在 erp_migrator 上
      ERP_DATABASE_URL: ${ERP_MIGRATION_DATABASE_URL:?ERP_MIGRATION_DATABASE_URL is required (postgresql+asyncpg://erp_migrator:...@<pg-host>:5432/smart_erp)}
    networks:
      - smart-erp-net
      - erp-db-net
    mem_limit: 128m
    cpus: 0.2
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # prometheus：规则评估器（full 档专属；demo 档不装监控，预算里没有评估器的分量）
  # 「规则不评估 = 规则不存在」：没有本进程时 alerts.rules.yaml 只是文本。
  # 规则文件直接挂仓库内的 observability/alerts.rules.yaml，不复制副本（单一事实源）。
  # 只挂 smart-erp-net：不需要 DB 网络。
  # 预算 320m / 0.35 核（3 个目标、低基数，15d TSDB 远小于该预算）
  # ---------------------------------------------------------------------------
  prometheus:
    profiles: ["full"]
    image: prom/prometheus:v2.53.0
    container_name: erp_prometheus
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15d 只需约 200MiB（3 个目标、低基数）；不设无限保留，避免 4C4G 宿主机被时序库吃满
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../observability/alerts.rules.yaml:/etc/prometheus/rules/smart-erp.rules.yaml:ro
      - prometheus_data:/prometheus
    networks:
      - smart-erp-net
    expose:
      # 9090 只在内网：运维排查走 docker exec/port-forward，不发布宿主端口
      - "9090"
    mem_limit: 320m
    cpus: 0.35
    healthcheck:
      # prom/prometheus 基于 busybox，自带 wget；不额外装探针依赖
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # alertmanager：告警去重与路由（full 档专属）
  # 当前无外部通知渠道，receiver 为空；「收到告警」的证据是 /api/v2/alerts。
  # 预算 96m / 0.15 核
  # ---------------------------------------------------------------------------
  alertmanager:
    profiles: ["full"]
    image: prom/alertmanager:v0.27.0
    container_name: erp_alertmanager
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - smart-erp-net
    expose:
      - "9093"
    mem_limit: 96m
    cpus: 0.15
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging

volumes:
  # demo 档没有 MinIO：对象走 LocalObjectStore 落在 erp_objects（§1A.3）
  erp_objects:
    name: smart-erp_objects
  erp_logs:
    name: smart-erp_logs
  # 15d 时序库；容量远小于 320m 内存上限，不单独限大小
  prometheus_data:
    name: smart-erp_prometheus
  # 告警静默/通知记录（Alertmanager 的 nflog + silences）
  alertmanager_data:
    name: smart-erp_alertmanager

networks:
  # 栈内互访网络
  smart-erp-net:
    name: smart-erp_net
  # 外部网络：APS 栈的默认网络，共用 PG15 只在该网内 expose 5432。
  # 该网络不存在时 up 会直接报错（预期行为），preflight 需先 `SELECT 1`。
  erp-db-net:
    name: ${ERP_DB_NETWORK:-hulkai-gz-api_default}
    external: true
