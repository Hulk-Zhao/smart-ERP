name: smart-erp CI

# 依据 docs/product/tech/02-并发开发路线.md §2.9 S8 与 §4.6：
#   流水线 = 静态校验 + lint + 单元测试 + 镜像构建门禁；**不含任何部署步骤**
#   （docker save、scp、docker load、compose up 仍在发布序列里由发布机执行）。
#
# 关于镜像构建（T806）：只 build、不 push、不产出发布包，目的是挡住
# 「代码/依赖/契约改了但镜像起不来」这一类回归；发布用的 tar 与 sha256 仍由
# scripts/build-images.sh 在发布机产出，两套职责不重叠。
# 触发范围用 changes job 过滤（见下），避免每次 PR 全量构建四镜像。

on:
  push:
    branches: [main]
    # 触发规则用「排除法」：除下列确定无关的路径外，任何改动都跑 CI。
    # 反例：白名单式 paths 每新增一种文件类型就会静默漏跑一次——
    # .git-blame-ignore-revs、docs/**、*.md 都这样漏过，PR 显示零 checks 却被当成「CI 通过」。
    # 规约：CI 未触发即视为未验证（docs/product/tech/00-协作规约.md §9 第 5 条）。
    paths-ignore:
      - "dist/**"
      - "**/.import_linter_cache/**"
  pull_request:
    paths-ignore:
      - "dist/**"
      - "**/.import_linter_cache/**"
  workflow_dispatch:

concurrency:
  group: smart-erp-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # 0. 变更范围：决定镜像构建是否需要跑
  #    `on.paths` 会过滤整条流水线（docs 改动就不跑 lint/测试了），所以路径过滤
  #    放在 job 级：只有下列路径变化才构建镜像。
  #    deploy/**                 compose / .env.example / 发布清单
  #    projects/smart-ERP/docker/**  四个 Dockerfile 与 nginx 配置
  #    contracts/**              web 构建期要拷进去的契约
  #    web/**                    web 镜像源码
  #    apps/**                   三个 Python 镜像的源码
  #    tests/**                  部署面测试变化往往伴随编排/镜像变化
  #    pyproject.toml            依赖变更会影响全部 Python 镜像
  # ---------------------------------------------------------------------------
  changes:
    name: 变更范围
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.diff.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        name: 判断是否触及镜像相关路径
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          head_sha="${GITHUB_SHA}"
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            base="$PUSH_BEFORE"
          else
            # workflow_dispatch 或新分支：退回上一个 commit
            base="$(git rev-parse "${head_sha}~1" 2>/dev/null || true)"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "无法确定基线，保守起见执行镜像构建"
            echo "images=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$head_sha")"
          echo "基线：$base"
          echo "变更文件："
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(deploy/|projects/smart-ERP/docker/|contracts/|web/|apps/|tests/|pyproject\.toml$)'; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          else
            echo "images=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 1. 部署面静态校验：compose 能解析、内存预算不超标、变量齐全、探针路径真实
  # ---------------------------------------------------------------------------
  deploy-static:
    name: 部署面静态校验
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装测试依赖
        run: python -m pip install --disable-pip-version-check pyyaml pytest

      - name: 预拉部署测试镜像 alpine:3.20（失败即 infra 红）
        # tar 行为用例要求镜像已在手：拉取失败必须是明确的 infra 红，
        # 不能在用例里 skip 掉、job 仍绿。tag 故意不钉 digest——断言只依赖
        # busybox tar 的排除语义；上游重推同 tag 时日志里的 digest 会变。
        run: |
          set -euo pipefail
          image="alpine:3.20"
          docker pull "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          if [ -z "$digest" ]; then
            echo "::error::${image} 拉取后 RepoDigests 为空"
            exit 1
          fi
          echo "pre-pull ok: ${image} -> ${digest}"

      - name: 离线静态校验（tests/deploy）
        # 不用 -t .：tests/ 下没有 __init__.py，顶层包发现会报 not importable。
        # -rs 把 skip 原因逐条打进日志（unittest 的 -v 虽也打印 skip 原因，但 -rs 是
        # pytest 专有；这里与 python-checks 统一用 pytest，保证「这条到底跑没跑」
        # 能直接翻日志回答，而不是靠人回忆）。
        run: python -m pytest tests/deploy -q -o addopts="" -rs

      - name: compose 正向解析（demo 档）
        run: |
          docker compose \
            --project-directory deploy/smart-erp \
            --env-file tests/deploy/compose.env \
            --file deploy/smart-erp/docker-compose.yml \
            --profile demo config --quiet

      - name: compose 正向解析（full 档）
        # full = demo 常驻服务 + doc / worker-agent / worker-io / migrate
        run: |
          docker compose \
            --project-directory deploy/smart-erp \
            --env-file tests/deploy/compose.env \
            --file deploy/smart-erp/docker-compose.yml \
            --profile full config --quiet

      - name: compose 负向校验（缺 ERP_IMAGE_TAG 必须失败）
        run: |
          set -euo pipefail
          grep -v '^ERP_IMAGE_TAG=' tests/deploy/compose.env > /tmp/no-tag.env
          if docker compose \
               --project-directory deploy/smart-erp \
               --env-file /tmp/no-tag.env \
               --file deploy/smart-erp/docker-compose.yml \
               config --quiet > /tmp/compose.out 2>/tmp/compose.err; then
            echo "::error::缺 ERP_IMAGE_TAG 时 compose config 竟然通过，tag 强制失效"
            exit 1
          fi
          grep -q "ERP_IMAGE_TAG" /tmp/compose.err /tmp/compose.out
          echo "负向校验通过：缺 ERP_IMAGE_TAG 时被拒绝"

  # ---------------------------------------------------------------------------
  # 2. shell lint：发布脚本是本流的交付物，语法与常见坑必须机器把关
  # ---------------------------------------------------------------------------
  shell-lint:
    name: 脚本 lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 语法检查
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: shellcheck
        run: shellcheck --severity=warning scripts/*.sh

  # ---------------------------------------------------------------------------
  # 3. Python lint + 单元测试（仓库全量，不只本流）
  # ---------------------------------------------------------------------------
  python-checks:
    name: Python lint 与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # 测试库：与部署档一致的 PG15（不用 latest）。
      # health-check 通过前 GitHub 不会开始执行下面的 steps，迁移不靠 sleep 猜就绪。
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: erp_test
          POSTGRES_DB: smart_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_test -d smart_erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        # [pdf] 必须一起装：pyproject 里 pypdfium2 是独立 extra，
        # 只装 [dev] 时 tests/docparse/test_pdf_extraction.py 会被 importorskip 整模块跳过，
        # 「真实 PDF 文本提取 / 扫描件报缺 OCR」两条核心路径在门禁里从没跑过。
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,pdf]" ruff pyyaml

      - name: 许可证门禁（AGPL / GPL / SSPL 硬拒绝 + 白名单）
        # 制度化的 AGPL 收口（docs/product/tech/01-技术架构.md §2.2）：
        # pip-licenses 枚举已安装依赖的许可证，scripts/check_licenses.py 对照
        # contracts/deps/license-allowlist.txt；失败时输出包名 + 许可证 + 反向依赖链。
        # pip-licenses 自身是 MIT，只装在 CI 里，不进运行期依赖。
        run: |
          python -m pip install --disable-pip-version-check pip-licenses
          python scripts/check_licenses.py

      - name: 锁文件漂移检查（存在 uv.lock 时）
        # CI 装依赖走的是 `pip install -e ".[dev]"`，根本不读 uv.lock，
        # 所以锁文件与 pyproject 漂移时没有任何流程会发现（曾出现 httpx 还挂在
        # dev extra、lock 与 pyproject 不一致，靠人工排查才发现）。这里补一道：
        # 有 uv.lock 就必须与 pyproject 一致；没有则跳过（不挡无锁文件的贡献者）。
        run: |
          if [ ! -f uv.lock ]; then
            echo "uv.lock 不存在，跳过锁文件检查"
            exit 0
          fi
          python -m pip install --disable-pip-version-check "uv>=0.5"
          uv lock --check

      - name: ruff 阻断档（真错误必须为零）
        # 只卡「代码真的坏了」这一档：E9=语法/解析错误，F63=比较/断言类无效写法，
        # F7=语法上合法但必然错的控制流，F82=未定义名（F821/F822/F823）。
        # 这些不是风格偏好，出现即代表运行时必炸，必须零容忍。
        run: |
          ruff check apps tests db observability \
            --select E9,F63,F7,F82 \
            --output-format=concise

      - name: ruff 风格项观测（非阻断）
        # 全量清理（当前 200+ 处，多数可 --fix）暂不动：扫描者若直接改全仓库文件，
        # 会和 S0/S7 的进行中改动冲突。这里只记录数字与趋势，不挡合并；
        # 等 S0/S7 收工后单独立项做一次集中收口（届时把本步骤转为门禁）。
        continue-on-error: true
        run: |
          echo "::group::ruff --statistics（全量风格项，仅观测）"
          ruff check apps tests db observability --statistics
          echo "::endgroup::"

      - name: 应用角色 erp_app + 授权（直接执行 00-provision.sql 的 §4/§7）
        # 「审计表不可改」只有以 erp_app 真实身份连接才测得出来：owner 不受 REVOKE 约束。
        # 角色必须在跑迁移之前存在，否则 0002/0006 里按角色存在性判断的
        # REVOKE/GRANT 会被整段跳过，用例只能 skip、等于没有证据。
        #
        # 授权不手抄：下面从 deploy/smart-erp/db/00-provision.sql 里**原样截取**
        # §4（schema）与 §7（权限）两段执行，只把迁移角色名 erp_migrator 换成 CI 的
        # erp_test。00-provision.sql 是授权的唯一真源（迁移里一条 GRANT 都没有），
        # 以后有人在那边加表授权/改默认权限，CI 自动跟着变，不会出现两份真源。
        #
        # 文件里另外几段**不能**在 CI 执行，原因写在这里而不是留给下一个人猜：
        #   §1 建角色：用了 psql 的 \gexec + 口令变量，asyncpg 跑不了 → 这里等价手写；
        #   §5 扩展：vector 非 trusted、需要 SUPERUSER，CI 的 postgres:15 没装 pgvector，
        #           且测试链不依赖向量检索；
        #   §8 版本表：CI 由 alembic 建，建表后由 §7 的默认权限自动授给 erp_app。
        # 解析结果为空会直接失败——不允许「一条都没解析出来还静默零授权」。
        run: |
          python - <<'PY'
          import asyncio
          import pathlib
          import re

          import asyncpg

          PROVISION = pathlib.Path("deploy/smart-erp/db/00-provision.sql")
          MIGRATOR = "erp_test"  # 本 job 跑迁移的角色；生产是 erp_migrator
          # §4 一条 CREATE SCHEMA + §7 三条 ALTER DEFAULT PRIVILEGES。
          # 这个数字是刻意的：§4/§7 里新增/删掉一处角色引用时，CI 会红并要求
          # 作者显式改这里，而不是被裸串替换悄悄带走（少替换 = 少授权）。
          ROLE_MENTIONS = 4
          ROLE = re.compile(r"\berp_migrator\b")
          DSN = "postgresql://erp_test:erp_test@127.0.0.1:5432/smart_erp_test"

          def section(text: str, number: int) -> str:
              """截取 `-- N. xxx` 横幅到下一个编号横幅之间的正文。

              只认行首 ``-- `` + 数字 + ``. ``（恰好一个空格）：文件头部的能力清单
              写成 ``--   4. ...``（三空格缩进），不能被当成 §4。
              """
              match = re.search(
                  rf"^-- {number}\. .*$([\s\S]*?)(?=^-- \d+\. )",
                  text,
                  re.MULTILINE,
              )
              if match is None:
                  raise SystemExit(f"00-provision.sql 里找不到 §{number}，脚本结构变了")
              return match.group(1)

          def statements(block: str) -> list[str]:
              body = " ".join(
                  line for line in block.splitlines()
                  if not line.lstrip().startswith("--")
              )
              return [stmt.strip() for stmt in body.split(";") if stmt.strip()]

          async def main() -> None:
              source = PROVISION.read_text(encoding="utf-8")
              raw = statements(section(source, 4) + section(source, 7))
              mentions = sum(len(ROLE.findall(stmt)) for stmt in raw)
              if mentions != ROLE_MENTIONS:
                  raise SystemExit(
                      f"00-provision.sql §4/§7 里 erp_migrator 实际出现 {mentions} 次，"
                      f"预期 {ROLE_MENTIONS} 次：请显式更新预期值后再让 CI 替角色名"
                  )
              sql = [ROLE.sub(MIGRATOR, stmt) for stmt in raw]
              if not any(
                  "ALTER DEFAULT PRIVILEGES" in stmt and "ON TABLES" in stmt
                  for stmt in sql
              ):
                  raise SystemExit("§7 未解析出 ALTER DEFAULT PRIVILEGES ... ON TABLES")

              conn = await asyncpg.connect(DSN)
              try:
                  exists = await conn.fetchval(
                      "SELECT 1 FROM pg_roles WHERE rolname = 'erp_app'"
                  )
                  if not exists:
                      await conn.execute(
                          "CREATE ROLE erp_app LOGIN PASSWORD 'erp_app_test_only' "
                          "NOSUPERUSER NOCREATEDB NOCREATEROLE"
                      )
                  for stmt in sql:
                      await conn.execute(stmt)
                  print(f"已执行 00-provision.sql §4/§7 共 {len(sql)} 条语句")
              finally:
                  await conn.close()

          asyncio.run(main())
          PY

      - name: 测试库迁移（0001→0006 全链）
        # service 的 health-check 已保证 PG 就绪；这里跑真实迁移链并用 alembic current
        # 断言停在 0006_audit_image_prev_uniq，避免「连上了但表没建」的假绿。
        # env.py 的连接串唯一真源是 ERP_DATABASE_URL（C14），不要另造一份。
        env:
          ERP_DATABASE_URL: postgresql+asyncpg://erp_test:erp_test@127.0.0.1:5432/smart_erp_test
        run: |
          set -euo pipefail
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini current | tee /tmp/alembic-current.txt
          grep -q "0006_audit_image_prev_uniq" /tmp/alembic-current.txt

      - name: 预拉部署测试镜像 alpine:3.20（失败即 infra 红）
        # tar 行为用例要求镜像已在手：拉取失败必须是明确的 infra 红，
        # 不能在用例里 skip 掉、job 仍绿。tag 故意不钉 digest——断言只依赖
        # busybox tar 的排除语义；上游重推同 tag 时日志里的 digest 会变。
        run: |
          set -euo pipefail
          image="alpine:3.20"
          docker pull "$image"
          digest="$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')"
          if [ -z "$digest" ]; then
            echo "::error::${image} 拉取后 RepoDigests 为空"
            exit 1
          fi
          echo "pre-pull ok: ${image} -> ${digest}"

      - name: pytest（按流分目录执行）
        # ERP_TEST_DATABASE_URL 让 tests/agents 的 PG 集成用例真正执行；
        # 未设置时那 45 条会静默 skip（Saga / 状态机 / 租约 / 补偿队列 / 审计链 / intent-verify）。
        env:
          ERP_TEST_DATABASE_URL: postgresql+asyncpg://erp_test:erp_test@127.0.0.1:5432/smart_erp_test
        # 为什么不是一次 `pytest tests`：
        #   1) 历史上 tests/connectors 与 tests/platform 有同名 test_errors.py /
        #      test_levels.py（后者已改名 test_connectors_*），且仓库没有
        #      tests/__init__.py → prepend 模式下报 import file mismatch；
        #   2) 只加 `--import-mode=importlib` 能解掉同名冲突，但会把「同目录裸导入」的
        #      helper 打挂（from support/dbutil/security_support import ...），实测 12 个
        #      模块收集失败。
        # 分目录 = 每个进程只收集一个目录，两个问题同时消失，且新增同名文件也不会再炸。
        # 待各流把 tests/ 改成正规包（__init__.py + 相对导入）后，可退回单进程全量收集。
        # tests/web 放的是前端 vitest 用例（由下面的 web-checks 跑），pytest 不收集；
        # 其余目录零容忍：任何非 0 退出即失败，不再有「无用例可容忍」的例外。
        run: |
          set -uo pipefail
          rc=0
          for d in tests/*/; do
            d="${d%/}"
            [ -d "$d" ] || continue
            if [ "$d" = "tests/web" ]; then
              echo "跳过 ${d}：前端用例由 web-checks 执行"
              continue
            fi
            echo "::group::pytest ${d}"
            # -o addopts="" 覆盖 pyproject 的 -q：否则 -q + -q = -qq 会把
            # "N passed / M skipped" 汇总行吞掉，skip 再次变成静默（本次事故的根因之一）。
            # 只改输出详略，不改退出码语义：任何非 0 仍然失败。
            status=0
            out=$(python -m pytest "${d}" -q -o addopts="" -rs 2>&1) || status=$?
            echo "$out"
            if [ "$status" -ne 0 ]; then
              echo "::error::pytest ${d} 失败"
              rc=1
            fi
            # tests/security 是审计表权限证据的唯一来源（以 erp_app 真实身份连接）。
            # 角色缺失/口令改不了时用例会带原因 skip —— 那种「绿但一条没跑」必须红。
            if [ "$d" = "tests/security" ] && echo "$out" | grep -Eq '[0-9]+ skipped'; then
              echo "::error::tests/security 出现 skipped：权限证据被静默跳过，检查 erp_app 角色是否在迁移前创建"
              rc=1
            fi
            echo "::endgroup::"
          done
          exit "$rc"

      - name: 基线观测（非阻断）：整棵 tests/ 单进程收集
        # 观测项，不是门禁。门禁是上面的分目录循环（每个进程只收集一个目录，
        # 同名文件与「同目录裸 helper 导入」两个问题同时消失）。
        #
        # 关于 --import-mode=importlib：实测不可用。它能解掉同名文件冲突，但
        # importlib 模式不会把测试目录加入 sys.path，导致 tests/agents、
        # tests/audit、tests/security 下 12 个模块的裸 helper 导入直接
        # ModuleNotFoundError（from support/dbutil/audit_support/security_support import ...）。
        # 因此这里保留 prepend 模式做「今天全量收集是否绿」的观测，红了不挡合并。
        continue-on-error: true
        run: python -m pytest tests -q

      - name: 导入边界契约（C2）
        run: lint-imports

  # ---------------------------------------------------------------------------
  # 4. 前端工作台：契约生成物漂移、单元测试、生产构建
  #    web/ 首次进主干后，这是唯一能拦住前端回归的门禁；三者任一失败即红。
  # ---------------------------------------------------------------------------
  web-checks:
    name: 前端契约 / 测试 / 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖（npm ci）
        run: npm ci

      - name: 契约生成物漂移检查
        run: npm run gen:api -- --check

      - name: 单元测试
        run: npm test -- --run

      - name: 生产构建
        run: npm run build

  # ---------------------------------------------------------------------------
  # 5. 镜像构建（T806）：四个镜像都 build，只加载到 runner 本地，不 push 任何仓库
  #    任一镜像构建失败 => 该 matrix 分支红 => 整个 job 红。
  #    不推仓库：没有 docker/login-action / push，permissions 也只有 contents: read。
  # ---------------------------------------------------------------------------
  image-build:
    name: 镜像构建（${{ matrix.image }}，不推送）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.images == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            dockerfile: projects/smart-ERP/docker/api.Dockerfile
          - image: connector-gw
            dockerfile: projects/smart-ERP/docker/connector-gw.Dockerfile
          - image: doc
            dockerfile: projects/smart-ERP/docker/docparse.Dockerfile
          - image: web
            dockerfile: projects/smart-ERP/docker/web.Dockerfile
            extra_args: --build-arg ERP_WEB_BASE=/demo/smart-erp/
    steps:
      - uses: actions/checkout@v4

      - name: docker build（${{ matrix.image }}）
        env:
          EXTRA_ARGS: ${{ matrix.extra_args }}
        run: |
          set -euo pipefail
          tag="ci-${GITHUB_SHA}"
          docker build --file "${{ matrix.dockerfile }}" --tag "smart-erp/${{ matrix.image }}:${tag}" ${EXTRA_ARGS} .
          docker image inspect "smart-erp/${{ matrix.image }}:${tag}" \
            --format '构建成功：${{ matrix.image }} {{.Id}} {{.Size}} bytes'
