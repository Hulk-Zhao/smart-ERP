[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-erp"
version = "0.1.0"
description = "聚合型 AI ERP —— 可审计业务执行层（Phase 1 / MVP）"
requires-python = ">=3.12"
# 依赖版本策略（2026-11-11 定）：
# 1. 运行时依赖一律写下界 + 上界（`>=x,<y`），上界取「最近一次全量实测通过的次版本 +1」；
#    不要写 `==`，否则安全补丁进不来。
# 2. 升级依赖必须单独开 PR，且 CI（Linux + Python 3.12，`pip install -e ".[dev]"`）
#    与本机各跑一遍全量测试后再合。
# 3. 不提交 uv.lock：CI 走 `pip install -e ".[dev]"` 根本不读它，入库只会形成
#    「本机一个真源、CI 另一个真源」的双头，比无锁更难查。
# 背景：2026-11-10 排查「CI 绿、本机红」时，本机锁 fastapi 0.162.3、CI 装 0.162.4，
# 靠两边各跑一遍才把它排除出嫌疑人；约束写在 pyproject.toml 里两处都看得见。
dependencies = [
    "fastapi>=0.115,<0.163",
    "uvicorn[standard]>=0.30,<0.55",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # connector-gw 的 U8 transport / mock 在导入期即依赖 httpx（非仅测试用）
    "httpx>=0.27",
    # apps/platform/api 的中间件与错误处理直接 import starlette（middleware.base /
    # requests / responses / types / exceptions），属直接依赖而非纯传递依赖，故给区间；
    # 1.x（当前 1.10.0）与 fastapi 0.162.4 实测解析通过。
    "starlette>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "import-linter>=2.0",
    # test_runtime_packaging.py 直接用 setuptools.find_packages 复算镜像布局；
    # Python 3.12 的干净环境不再自带 setuptools，必须显式声明（B-S8-01）。
    "setuptools>=69",
]
# PDF 文本层抽取：仅 doc 镜像安装，核心安装零 PDF 依赖。
# 不用 PyMuPDF（AGPL-3.0）；pypdfium2 为 BSD-3-Clause/Apache-2.0，自带 PDFium。
pdf = [
    "pypdfium2>=5",
]

[tool.setuptools.packages.find]
# core / tools 是 C15 常驻进程入口（python -m core.runtime.worker 等），
# 只打 apps* 时即使补了文件镜像里也会 ModuleNotFoundError（B-S8-01）。
# observability 是 apps.main 导入期依赖（2026-11-11：漏打后镜像能 build 成功，
# api 容器一启动就 ModuleNotFoundError → web 反代 502）。
include = ["apps*", "core*", "tools*", "observability*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

# C2 / §3.2.3：连接器 transport 只允许连接器 SDK 与写入网关使用。
# 枚举式 forbidden 契约对「新增模块忘记登记」不设防，另由
# tests/platform/test_connector_transport_isolation.py 做全量 AST 扫描兜底。
[tool.importlinter]
root_packages = ["apps"]

[[tool.importlinter.contracts]]
name = "连接器 transport 只允许 SDK 与 WriteGateway 导入"
type = "forbidden"
source_modules = [
    "apps.main",
    "apps.platform.config",
    "apps.platform.contracts.agent",
    "apps.platform.contracts.audit",
    "apps.platform.contracts.canonical",
    "apps.platform.contracts.errors",
    "apps.platform.contracts.ticket",
    "apps.platform.db.models",
    "apps.platform.db.session",
    "apps.platform.policy.levels",
    "apps.platform.policy.registry",
]
forbidden_modules = ["apps.platform.connectors.transport"]
# 契约只约束**直接**导入：穿透经 `apps.platform.connectors.sdk` 是设计内的唯一通路
# （`main -> container -> sdk -> transport` 每一跳都合法，判定粒度不该把传递依赖算违规）。
# 直接导入由本契约拦，`tests/platform/test_connector_transport_isolation.py` 对 `apps/`
# 做全量 AST 扫描兜底；两者互补，不设任何逐模块豁免清单。
allow_indirect_imports = true
