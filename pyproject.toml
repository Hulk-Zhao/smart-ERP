[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-erp"
version = "0.1.0"
description = "聚合型 AI ERP —— 可审计业务执行层（Phase 1 / MVP）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # connector-gw 的 U8 transport / mock 在导入期即依赖 httpx（非仅测试用）
    "httpx>=0.27",
    # apps/platform/api 的中间件直接继承 starlette；不写版本约束，
    # 沿用 fastapi 选定的那一版，避免与 fastapi 的依赖区间冲突。
    "starlette",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "import-linter>=2.0",
]

[tool.setuptools.packages.find]
include = ["apps*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

# C2 / §3.2.3：连接器 transport 只允许连接器 SDK 与写入网关使用。
# 枚举式 forbidden 契约对「新增模块忘记登记」不设防，另由
# tests/platform/test_connector_transport_isolation.py 做全量 AST 扫描兜底。
[tool.importlinter]
root_packages = ["apps"]

[[tool.importlinter.contracts]]
name = "连接器 transport 只允许 SDK 与 WriteGateway 导入"
type = "forbidden"
source_modules = [
    "apps.main",
    "apps.platform.config",
    "apps.platform.contracts.agent",
    "apps.platform.contracts.audit",
    "apps.platform.contracts.canonical",
    "apps.platform.contracts.errors",
    "apps.platform.contracts.ticket",
    "apps.platform.db.models",
    "apps.platform.db.session",
    "apps.platform.policy.levels",
    "apps.platform.policy.registry",
]
forbidden_modules = ["apps.platform.connectors.transport"]
