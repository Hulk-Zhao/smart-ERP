# smart-ERP 告警规则（Prometheus rule file，S7 / T702）
#
# 直接挂载：prometheus.yml 的 rule_files:
#   - /etc/prometheus/rules/smart-erp.rules.yaml
# 语法校验：python -c "import yaml; yaml.safe_load(open('observability/alerts.rules.yaml'))"
#
# ⚠ 部署内没有评估器（2026-11-11 核实，基准 origin/main 0f597b3）
#   本文件是「规则定义」，不是「正在生效的告警」。deploy/ 全目录没有 Prometheus /
#   Alertmanager，也没有任何 scrape_configs 或 rule_files 配置；compose 的 10 个服务里
#   没有任何进程读取或评估本文件。下面标「生效」的 2 条，真实状态是：语法通过、有采集点，
#   但没有任何进程会评估它们——故障发生时，与注释掉的规则没有区别。
#   在评估器（含抓取配置）接入前，不得在任何地方声称「线上有告警」。
#
# 标签约定：severity = P0（立即叫醒，安全/审计）| P1（15 分钟内响应）| P2（工作时间处理）。
# 每条规则都写 why_paged：说明为什么值得半夜叫醒人，而不是“指标看起来不对”。
# ---------------------------------------------------------------------------
# 当前状态（2026-11-11，基准 origin/main 0f597b3）
#   生效 2 条：SmartErpReconBatchFailureRateHigh、SmartErpReconBatchP95Slow
#     依赖的 recon_batches_total / recon_batch_duration_seconds 已有生产采集点；
#     但部署内无评估器（见上），它们目前不会产生任何告警。
#   注释 9 条：3 条 T702 历史规则（write 失败率 / unresolved 增长 / 审计链 P0）
#     + 6 条补偿与时钟新规则。原因：依赖指标零生产采集点，启用即永不触发；
#     假的安全感比没有安全感更危险。归属流：apps/write、apps/tickets、
#     apps/audit、apps/agents、apps/runtime。
#     取消注释条件：见每条规则上方「采集点待接线（归属流：…；解锁条件：…）」
#     以及 README §6.1.3 的「取消注释的前置条件」列。
#   建议 1 条：SmartErpReconRunFailureRateHigh 已有采集点，等真实基线后再启用。
# ---------------------------------------------------------------------------

groups:
  - name: smart-erp-s7-alerts
    rules:
      # ------------------------------------------------------------------
      # P1：写入失败率
      # 指标：smart_erp_write_stage_failures_total / smart_erp_write_stage_total
      # ------------------------------------------------------------------
      # 采集点待接线（归属流：apps/write；解锁条件：WriteGateway.execute() 内按阶段埋 record_stage()，且 /metrics 上存在 stage="write" 的非零序列）
