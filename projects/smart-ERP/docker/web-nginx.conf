# web 容器内的 server 配置（被 web-nginx-main.conf include）
# 生产路径：香港 Nginx 把 /demo/smart-erp/* rewrite 去前缀后打到本容器 8080（§1A.4）。
# 本机预览：直接访问 127.0.0.1:8088，/erp/api/ 前缀由本文件反代到 api 容器。

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # compose healthcheck 打这里；探针不得触发业务写（C13）
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Docker 内置 DNS：配合下面的变量式 proxy_pass，让 api 在**请求时**解析而不是
    # 启动时解析。否则 api 未就绪/容器重建期间 nginx 会以
    # "host not found in upstream" 直接起不来（crash-loop）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $erp_api_upstream http://api:8010;

    # 仅供本机预览使用；云上由香港 Nginx 直连 api:8010，不经过本容器
    # proxy_pass 结尾必须带 "/"：剥掉 /erp/api/ 前缀再转给 api。api 以
    # uvicorn --root-path=/erp/api 启动，应用内只认无前缀路径（/healthz、/metrics）；
    # 保留前缀会让所有 /erp/api/* 返回 404（旧写法就是漏了这个尾斜杠）。
    location /erp/api/ {
        proxy_pass $erp_api_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / 流式响应必须关缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 带内容哈希的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口页不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
