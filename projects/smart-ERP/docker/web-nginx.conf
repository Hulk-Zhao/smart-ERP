# web 容器内的 server 配置（被 web-nginx-main.conf include）
# 生产路径：香港 Nginx 把 /demo/smart-erp/* rewrite 去前缀后打到本容器 8080（§1A.4）。
# 本机预览：直接访问 127.0.0.1:8088，/erp/api/ 前缀由本文件反代到 api 容器。

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # compose healthcheck 打这里；探针不得触发业务写（C13）
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # 仅供本机预览使用；云上由香港 Nginx 直连 api:8010，不经过本容器。
    # 上游必须写字面量，且 URI 恰好是 "/"：nginx 在 proxy_pass 里使用变量时
    # **不做 location 前缀替换**，URI 会按指令原样发送——`$upstream/` 会把所有
    # /erp/api/* 都压成 "/"，全部 404（2026-11-11 真容器实测）。
    # api 以 uvicorn --root-path=/erp/api 启动，应用内只认无前缀路径（/healthz、/metrics）。
    # 代价：nginx 启动时解析一次 api；compose 里 web depends_on api(service_healthy)，
    # api 重建后需 reload web。不要为了「请求时解析」改回变量式。
    location /erp/api/ {
        proxy_pass http://api:8010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / 流式响应必须关缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 带内容哈希的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口页不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
