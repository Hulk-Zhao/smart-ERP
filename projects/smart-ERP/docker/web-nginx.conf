# web 容器内的 server 配置（被 web-nginx-main.conf include）
# 生产路径：香港 Nginx 把 /demo/smart-erp/* rewrite 去前缀后打到本容器 8080（§1A.4）。
# 本机预览：直接访问 127.0.0.1:8088，/erp/api/ 前缀由本文件反代到 api 容器。

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # compose healthcheck 打这里；探针不得触发业务写（C13）
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Docker 内置 DNS：让 api 在**请求时**解析，api 未就绪/重建期间 nginx 不会
    # 因 "host not found in upstream" 直接起不来。ipv6=off 必须保留：api 只监听
    # IPv4，nginx 若选中 AAAA 会 502（2026-11-11 CI 事故）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $erp_api_upstream http://api:8010;

    # 仅供本机预览使用；云上由香港 Nginx 直连 api:8010，不经过本容器。
    # 变量式 proxy_pass **不带 URI**，因此 nginx 不做隐式前缀替换，必须显式
    # rewrite 剥掉 /erp/api/。`(.*)` 为空时 `/erp/api/` → `/`，不会产生空 URI。
    # 反例：proxy_pass $erp_api_upstream/; 会把所有请求压成 "/"，全部 404。
    location /erp/api/ {
        rewrite ^/erp/api/(.*)$ /$1 break;
        proxy_pass $erp_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / 流式响应必须关缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 带内容哈希的构建产物：长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口页不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
