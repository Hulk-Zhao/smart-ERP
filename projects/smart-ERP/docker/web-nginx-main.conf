# nginx 主配置（web 镜像专用，非 root 运行）
# 与官方 nginx.conf 的差异只有一处目的：pid / 临时目录 / 日志全部落到可写位置，
# 这样容器可以用 USER 10001 跑，而不需要改 /var/cache/nginx 的属主。

worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path       /tmp/nginx/proxy_temp;
    fastcgi_temp_path     /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx/uwsgi_temp;
    scgi_temp_path        /tmp/nginx/scgi_temp;

    log_format json_erp escape=json
      '{"ts":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
      '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
      '"rt":$request_time,"ua":"$http_user_agent"}';
    access_log /dev/stdout json_erp;

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;
    keepalive_timeout 65;

    # 首屏静态资源 gzip 后 ≤500KB（5Mbps 出网约束，§1A.1）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
